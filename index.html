<!-- Modal de Consulta de Ganadores (Documento Público) -->
  <div id="modalGanadores" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:white; border-radius:12px; width:90%; max-width:600px; padding:20px; box-shadow:0 8px 25px rgba(0,0,0,0.3); position:relative; max-height:85vh; overflow-y:auto;">
      
      <!-- Botón para cerrar -->
      <button onclick="cerrarModalGanadores()" style="position:absolute; top:15px; right:15px; background:none; border:none; font-size:1.4rem; cursor:pointer; color:#666;">&times;</button>
      
      <h3 style="color:#0b2545; border-bottom:2px solid #eef2f7; padding-bottom:10px; text-align:center;">
        <i class="fas fa-trophy" style="color:#e0a96d;"></i> Consulta Pública de Ganadores
      </h3>
      
      <!-- Buscador -->
      <div style="margin: 15px 0; display:flex; gap:10px;">
        <input type="text" id="inputBuscarGanador" placeholder="Ingrese Documento o N° de Tabla" style="flex:1; padding:10px; border:1.5px solid #cbd5e0; border-radius:8px;">
        <button onclick="buscarGanador()" style="background:#2a6f97; color:white; border:none; padding:10px 15px; border-radius:8px; font-weight:bold; cursor:pointer;">
          <i class="fas fa-search"></i> Buscar
        </button>
      </div>

      <!-- Tabla de Resultados -->
      <div style="overflow-x:auto;">
        <table style="width:100%; border-collapse:collapse; font-size:0.9rem; text-align:left;">
          <thead>
            <tr style="background:#0b2545; color:white;">
              <th style="padding:8px 10px;">Premio</th>
              <th style="padding:8px 10px;">N° Tabla</th>
              <th style="padding:8px 10px;">Ganador</th>
              <th style="padding:8px 10px;">Documento</th>
            </tr>
          </thead>
          <tbody id="tablaGanadoresBody">
            <!-- Datos de ejemplo de la lista de ganadores -->
            <tr style="border-bottom:1px solid #e2e8f0;">
              <td style="padding:8px 10px; font-weight:bold; color:#2a6f97;">Gran Premio Navideño</td>
              <td style="padding:8px 10px; font-weight:bold;">2501</td>
              <td style="padding:8px 10px;">Juan Pérez</td>
              <td style="padding:8px 10px;">1040***456</td>
            </tr>
            <tr style="border-bottom:1px solid #e2e8f0;">
              <td style="padding:8px 10px; font-weight:bold; color:#2a6f97;">Premio Secundario</td>
              <td style="padding:8px 10px; font-weight:bold;">1204</td>
              <td style="padding:8px 10px;">María Rodríguez</td>
              <td style="padding:8px 10px;">1020***789</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div style="text-align:center; margin-top:15px;">
        <button onclick="cerrarModalGanadores()" style="background:#edf2f7; color:#4a5568; border:1px solid #cbd5e0; padding:8px 16px; border-radius:6px; font-weight:bold; cursor:pointer;">Cerrar</button>
      </div>
    </div>
  </div>
